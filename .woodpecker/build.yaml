when:
  - event: manual
    branch: main
  - event: push
    branch: main

steps:
  - name: build
    image: codeberg.org/mark22k/ci:latest
    pull: true
    commands:
      - export PATH="$HOME/.local/bin:$PATH"
      - make debian
