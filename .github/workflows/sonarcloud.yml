name: SonarCloud
on:
  push:
    branches:
      - github
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    env:
      BUILD_WRAPPER_OUT_DIR: build_wrapper_output_directory
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo add-apt-repository --yes ppa:mhier/libboost-latest
          sudo apt-get install --yes build-essential git meson ninja-build cmake libboost1.83-dev libboost-log1.83-dev libyaml-cpp-dev libpcap-dev libtins-dev googletest gcovr libcap-ng-dev libseccomp-dev
          git clone https://github.com/LaKabane/libtuntap.git /tmp/libtuntap/
          cd /tmp/
          cmake -DCMAKE_BUILD_TYPE=Release -B build -S "libtuntap"
          cmake --build build
          sudo cmake --install build --prefix /usr
      - name: Install Build Wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
      - name: Configure
        run: meson setup -Db_coverage=true build
      - name: Run Build Wrapper
        run: |
          build-wrapper-linux-x86-64 --out-dir ${{ env.BUILD_WRAPPER_OUT_DIR }} make clean all test
      - name: Generate coverage report
        run: ninja -C build coverage-sonarqube
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            --define "sonar.cfamily.compile-commands=${{ env.BUILD_WRAPPER_OUT_DIR }}/compile_commands.json" --define "sonar.coverageReportPaths=build/meson-logs/sonarqube.xml"
